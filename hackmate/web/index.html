<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HackMate</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --panel: #141414;
      --panel-2: #1a1a1a;
      --panel-3: #202020;
      --line: #2a2a2a;
      --line-2: #383838;
      --text: #e8e8e8;
      --text-2: #b8b8b8;
      --muted: #8a8a8a;
      --faint: #5a5a5a;
      --accent: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.55 -apple-system, "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: #555; color: #fff; }

    .app { height: 100vh; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); margin-right: 5px; }
    .dot.on { background: #fff; }

    .workspace { height: 100%; display: grid; grid-template-columns: 280px 1fr 240px; min-height: 0; }

    /* 左栏：目标 */
    .left { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--panel); min-height: 0; }
    .target-set { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
    .target-set input {
      flex: 1; min-width: 0; padding: 7px 10px; background: var(--panel-3);
      border: 1px solid var(--line-2); border-radius: 3px; color: var(--text); font: inherit; outline: none;
    }
    .target-set input:focus { border-color: #666; }
    .target-set button {
      padding: 7px 12px; background: var(--panel-3); border: 1px solid var(--line-2);
      border-radius: 3px; color: var(--text); font: inherit; cursor: pointer; white-space: nowrap;
    }
    .target-set button:hover { border-color: #666; }

    .tree { flex: 1; overflow: auto; padding: 8px 6px; min-height: 0; }
    .tree-empty { padding: 14px 10px; color: var(--faint); font-size: 12px; }

    .trow { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 3px;
      color: var(--text-2); font-size: 13px; cursor: pointer; white-space: nowrap; }
    .trow:hover { background: var(--panel-3); }
    .trow .chev { width: 10px; color: var(--muted); flex: 0 0 10px; }
    .trow .path { overflow: hidden; text-overflow: ellipsis; }
    .trow.site { color: var(--text); font-weight: 600; }
    .trow.sub { padding-left: 20px; color: var(--text-2); }
    .trow.file { padding-left: 34px; color: var(--muted); font-size: 12px; }
    .trow.file:hover { color: var(--text); }
    .trow.file .path::before { content: "└ "; color: var(--faint); }

    .left-foot { padding: 12px 14px; border-top: 1px solid var(--line); }
    .recon-btn {
      width: 100%; padding: 9px; background: var(--panel-3); border: 1px solid var(--line-2);
      border-radius: 3px; color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
    }
    .recon-btn:hover:not(:disabled) { border-color: #888; }
    .recon-btn:disabled { opacity: .45; cursor: default; }
    .recon-state { margin-top: 7px; font-size: 11px; color: var(--faint); }
    .meta-line { margin-top: 9px; font-size: 11px; color: var(--faint); }

    /* 中栏：对话 */
    .center { display: flex; flex-direction: column; background: var(--bg); min-width: 0; min-height: 0; }
    .activity { flex: 0 0 auto; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .action-now { font-size: 13px; color: var(--text-2); }
    .action-now b { color: var(--text); font-weight: 600; }
    .action-now .idle { color: var(--faint); }

    .chat-history { flex: 1; overflow: auto; padding: 16px 18px; min-height: 0; }
    .msg { margin-bottom: 14px; }
    .msg .who { font-size: 11px; color: var(--faint); margin-bottom: 4px; font-weight: 600; }
    .msg.user .who { color: var(--muted); }
    .msg .say { color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.7; }

    .composer { flex: 0 0 auto; display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--panel); }
    .composer input {
      flex: 1; min-width: 0; padding: 9px 12px; background: var(--panel-3);
      border: 1px solid var(--line-2); border-radius: 3px; color: var(--text); font: inherit; outline: none;
    }
    .composer input:focus { border-color: #666; }
    .stop-btn { padding: 9px 14px; background: transparent; border: 1px solid var(--line-2); border-radius: 3px; color: var(--text-2); font: inherit; cursor: pointer; white-space: nowrap; }
    .stop-btn:hover:not(:disabled) { border-color: #888; color: var(--text); }
    .stop-btn:disabled { opacity: .4; cursor: default; }
    .send-btn { padding: 9px 18px; background: var(--text); border: 1px solid var(--text); border-radius: 3px; color: #0d0d0d; font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .send-btn:disabled { opacity: .5; cursor: default; }

    /* 右栏：tools */
    .right { display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--panel); min-height: 0; }
    .right-title { padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--text-2); letter-spacing: .5px; }
    .tool-list { flex: 1; overflow: auto; padding: 8px; min-height: 0; }
    .tool-item { padding: 8px 10px; border-bottom: 1px solid var(--line); }
    .tool-item:last-child { border-bottom: none; }
    .tool-name { font-size: 13px; color: var(--text); font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
    .tool-ready { font-size: 10px; padding: 1px 7px; border-radius: 2px; }
    .tool-ready.yes { color: #0d0d0d; background: var(--text); font-weight: 700; }
    .tool-ready.no { color: var(--faint); border: 1px solid var(--line-2); }
    .tool-desc { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
    .tool-note { font-size: 11px; color: var(--faint); margin-top: 3px; }

    /* drawer */
    .drawer {
      position: fixed; top: 0; right: 0; height: 100vh; width: 360px;
      background: var(--panel); border-left: 1px solid var(--line-2);
      transform: translateX(100%); transition: transform .18s ease; z-index: 50;
      display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
    .drawer-head b { font-size: 14px; word-break: break-all; }
    .drawer-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 6px; }
    .drawer-close:hover { color: var(--text); }
    .drawer-body { flex: 1; overflow: auto; padding: 16px; }
    .d-section { margin-bottom: 18px; }
    .d-section h4 { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; font-weight: 700; }
    .d-kv { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .d-kv:last-child { border-bottom: none; }
    .d-kv .k { color: var(--muted); flex: 0 0 110px; word-break: break-all; }
    .d-kv .v { color: var(--text); flex: 1; word-break: break-all; }
    .d-empty { color: var(--faint); font-size: 12px; }
    .d-form-head { font-size: 12px; color: var(--text-2); margin: 6px 0 4px; word-break: break-all; }
    .d-badge-vuln { display: inline-block; padding: 2px 8px; margin: 0 4px 4px 0; border: 1px solid var(--line-2); border-radius: 3px; font-size: 11px; color: var(--text); }
    .d-badge-tech { font-size: 12px; color: var(--text-2); }
    .d-badge-waf { display: inline-block; padding: 2px 8px; border: 1px solid var(--text-2); border-radius: 3px; font-size: 11px; color: var(--text); }
    .d-badge-cve { font-size: 11px; color: var(--muted); padding: 2px 0; }
  </style>
</head>
<body>
  <div class="app">
    <main class="workspace">
      <aside class="left">
        <div class="target-set">
          <input id="target-input" placeholder="输入目标 URL，如 https://example.com" autocomplete="off">
          <button id="target-btn" type="button">设定</button>
        </div>
        <div class="tree" id="tree"></div>
        <div class="left-foot">
          <button class="recon-btn" id="recon-btn" type="button" disabled>Recon 侦查</button>
          <div class="recon-state" id="recon-state"></div>
          <button class="recon-btn" id="workflow-btn" type="button" disabled>启动五 Agent 工作流</button>
          <div class="recon-state" id="workflow-state"></div>
          <button class="recon-btn" id="research-btn" type="button" disabled>Research / 查 CVE</button>
          <button class="recon-btn" id="research-manage-btn" type="button" disabled>候选审核 / Skill Eval</button>
          <div class="recon-state" id="research-state"></div>
          <div class="meta-line"><i class="dot" id="cdp-dot"></i><span id="cdp-status">…</span> · <span id="model-state">…</span></div>
        </div>
      </aside>

      <section class="center">
        <div class="activity">
          <div class="action-now" id="action-now"><span class="idle">HackMate 待命</span></div>
        </div>
        <div class="chat-history" id="chat-history"></div>
        <form class="composer" id="chat-form">
          <input id="chat-input" placeholder="和 HackMate 对话…" autocomplete="off">
          <button class="stop-btn" id="stop-btn" type="button" disabled>停止</button>
          <button class="send-btn" id="send-btn" type="submit">发送</button>
        </form>
      </section>

      <aside class="right">
        <div class="right-title">Tools / Vendors</div>
        <div class="tool-list" id="tool-list"></div>
      </aside>
    </main>
  </div>

  <div class="drawer" id="drawer">
    <div class="drawer-head"><b id="drawer-title">详情</b><button class="drawer-close" id="drawer-close" type="button">×</button></div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let currentTarget = null;
    let workflowTaskId = '';
    let targets = [];
    let collapsed = new Set();

    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    }

    function isSubdomain(host, mainHost) {
      if (!mainHost) return false;
      return host !== mainHost && host.endsWith('.' + mainHost);
    }

    function renderTree() {
      const tree = $('tree');
      tree.replaceChildren();
      if (!targets.length) {
        tree.append(el('div', 'tree-empty', currentTarget
          ? '目标已设定，侦查后入口会显示在这里'
          : '输入目标 URL 开始'));
        return;
      }
      // 三级：母域名 -> 子域名 -> 路径
      targets.forEach(dom => {
        const domKey = 'dom:' + dom.domain;
        const domCollapsed = collapsed.has(domKey);
        const domRow = el('div', 'trow site');
        domRow.append(el('span', 'chev', domCollapsed ? '▸' : '▾'), el('span', 'path', dom.domain));
        domRow.addEventListener('click', () => {
          if (collapsed.has(domKey)) collapsed.delete(domKey); else collapsed.add(domKey);
          renderTree();
        });
        tree.append(domRow);
        if (domCollapsed) return;

        dom.subdomains.forEach(sub => {
          const subCollapsed = collapsed.has(sub.origin);
          const subRow = el('div', 'trow sub');
          subRow.append(el('span', 'chev', subCollapsed ? '▸' : '▾'), el('span', 'path', sub.host));
          subRow.addEventListener('click', () => {
            if (collapsed.has(sub.origin)) collapsed.delete(sub.origin); else collapsed.add(sub.origin);
            renderTree();
          });
          tree.append(subRow);
          if (!subCollapsed) {
            sub.pages.forEach(p => {
              const row = el('div', 'trow file');
              row.append(el('span', 'path', p.path));
              row.title = p.url;
              row.addEventListener('click', () => openDrawer(p));
              tree.append(row);
            });
          }
        });
      });
    }

    function renderChat(messages, busy, cancelRequested) {
      const hist = $('chat-history');
      const nearBottom = hist.scrollHeight - hist.scrollTop - hist.clientHeight < 80;
      const prevLen = hist.childElementCount;
      const savedTop = hist.scrollTop;
      hist.replaceChildren();
      messages.forEach(m => {
        const row = el('div', 'msg ' + m.role);
        row.append(el('div', 'who', m.role === 'user' ? '你' : 'HackMate'));
        row.append(el('div', 'say', m.content));
        hist.append(row);
      });
      // 只在「用户在底部」或「有新消息输出」时自动滚到底部；
      // 用户往上翻历史时保持其位置，不被轮询拉回底部。
      if (nearBottom || messages.length > prevLen) {
        hist.scrollTop = hist.scrollHeight;
      } else {
        hist.scrollTop = savedTop;
      }
      $('send-btn').disabled = busy;
      $('send-btn').textContent = busy ? '处理中' : '发送';
      $('stop-btn').disabled = !busy || cancelRequested;
      $('stop-btn').textContent = cancelRequested ? '停止中' : '停止';
    }

    function renderAction(actions, busy) {
      const now = $('action-now');
      const running = actions.find(a => a.status === 'running');
      const last = actions[actions.length - 1];
      if (busy || running) {
        const a = running || last;
        now.innerHTML = '';
        now.append('HackMate 正在 ', el('b', '', a ? a.label : '…'));
      } else if (last) {
        now.innerHTML = '';
        now.append('上一步 ', el('b', '', last.label));
      } else {
        now.innerHTML = '<span class="idle">HackMate 待命</span>';
      }
    }

    function renderTools(tools) {
      const list = $('tool-list');
      list.replaceChildren();
      tools.forEach(t => {
        const item = el('div', 'tool-item');
        const name = el('div', 'tool-name', t.name);
        name.append(el('span', 'tool-ready ' + (t.ready ? 'yes' : 'no'), t.ready ? 'READY' : 'NO'));
        item.append(name);
        if (t.desc) item.append(el('div', 'tool-desc', t.desc));
        if (t.note) item.append(el('div', 'tool-note', t.note));
        list.append(item);
      });
    }

    function openDrawer(page) {
      $('drawer-title').textContent = page.url;
      const body = $('drawer-body');
      body.replaceChildren();
      const kv = (k, v) => {
        const row = el('div', 'd-kv');
        row.append(el('span', 'k', k), el('span', 'v', String(v == null ? '—' : v)));
        return row;
      };

      if (page.vulns && page.vulns.length) {
        const secV = el('div', 'd-section');
        secV.append(el('h4', '', '可能的漏洞'));
        page.vulns.forEach(v => secV.append(el('div', 'd-badge-vuln', v)));
        body.append(secV);
      }
      if (page.tech) {
        const secT = el('div', 'd-section');
        secT.append(el('h4', '', '技术栈'));
        secT.append(el('div', 'd-badge-tech', page.tech));
        body.append(secT);
      }
      if (page.waf) {
        const secW = el('div', 'd-section');
        secW.append(el('h4', '', 'WAF'));
        secW.append(el('div', 'd-badge-waf', page.waf));
        body.append(secW);
      }
      if (page.cves && page.cves.length) {
        const secC = el('div', 'd-section');
        secC.append(el('h4', '', 'CVE'));
        page.cves.forEach(c => secC.append(el('div', 'd-badge-cve', c)));
        body.append(secC);
      }

      const sec1 = el('div', 'd-section');
      sec1.append(el('h4', '', '请求'));
      sec1.append(kv('URL', page.url));
      sec1.append(kv('域名', page.host));
      sec1.append(kv('路径', page.path));
      sec1.append(kv('Method', page.method || 'GET'));
      sec1.append(kv('HTTP Code', page.status));
      body.append(sec1);

      const sec2 = el('div', 'd-section');
      sec2.append(el('h4', '', 'URL 参数'));
      if (page.params && page.params.length) {
        page.params.forEach(p => sec2.append(kv(p.name, p.value)));
      } else sec2.append(el('div', 'd-empty', '无 URL 参数'));
      body.append(sec2);

      const sec3 = el('div', 'd-section');
      sec3.append(el('h4', '', '表单'));
      if (page.form && page.form.length) {
        page.form.forEach(f => {
          sec3.append(el('div', 'd-form-head', (f.action || '') + '  ·  ' + f.method));
          f.fields.forEach(fd => sec3.append(kv(fd.name || '(未命名)', fd.type)));
        });
      } else sec3.append(el('div', 'd-empty', '无表单'));
      body.append(sec3);

      const sec4 = el('div', 'd-section');
      sec4.append(el('h4', '', 'Cookies'));
      if (page.cookies && page.cookies.length) {
        page.cookies.forEach(c => sec4.append(kv(c.name, 'Set-Cookie')));
      } else sec4.append(el('div', 'd-empty', '无 Set-Cookie'));
      body.append(sec4);

      $('drawer').classList.add('open');
    }

    async function refresh() {
      try {
        const r = await fetch('/api/state', { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const s = await r.json();
        targets = s.targets || [];
        if (s.target) {
          const t = { origin: s.target.origin, host: s.target.host };
          if (!currentTarget || currentTarget.origin !== t.origin) {
            currentTarget = t;
            $('target-input').value = s.target.origin;
          }
        }
        renderTree();
        renderChat(s.chat || [], s.busy, s.cancel_requested);
        renderAction(s.actions || [], s.busy);
        renderTools(s.tools || []);
        const c = s.cdp_connected;
        $('cdp-dot').className = 'dot' + (c ? ' on' : '');
        $('cdp-status').textContent = c ? '已连接' : '未连接';
        $('model-state').textContent = s.configured ? s.model : '未配置';
        $('recon-btn').disabled = !currentTarget || (s.recon && s.recon.running);
        const wf = s.workflow || {};
        workflowTaskId = wf.task_id || '';
        $('workflow-btn').disabled = !currentTarget || ['queued', 'running', 'VALIDATING_SCOPE', 'RECON_RUNNING', 'ANALYZE_RUNNING', 'ATTACK_RUNNING', 'REPORT_RUNNING'].includes(wf.status);
        $('research-btn').disabled = !wf.task_id || ['queued', 'running', 'VALIDATING_SCOPE', 'RECON_RUNNING', 'ANALYZE_RUNNING', 'ATTACK_RUNNING', 'REPORT_RUNNING'].includes(wf.status);
        $('research-manage-btn').disabled = !wf.task_id || ['queued', 'running', 'VALIDATING_SCOPE', 'RECON_RUNNING', 'ANALYZE_RUNNING', 'ATTACK_RUNNING', 'REPORT_RUNNING'].includes(wf.status);
        $('workflow-state').textContent = wf.task_id
          ? `${wf.status || 'queued'} · ${wf.summary || wf.task_id}` : '需在 config.json 配置已批准的 Scope';
        const rs = $('recon-state');
        if (s.recon && s.recon.running) rs.textContent = '侦查中 ' + s.recon.visited + ' 页';
        else if (s.recon && s.recon.error && s.recon.error.includes('复用')) rs.textContent = s.recon.error;
        else if (s.recon && s.recon.found) rs.textContent = '发现 ' + s.recon.found + ' 页';
        else rs.textContent = '';
      } catch (e) {
        $('cdp-status').textContent = '连接中断';
      }
    }

    $('target-btn').addEventListener('click', setTarget);
    $('target-input').addEventListener('keydown', e => { if (e.key === 'Enter') setTarget(); });
    async function setTarget() {
      const url = $('target-input').value.trim();
      if (!url) return;
      try {
        const r = await fetch('/api/target', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const d = await r.json();
        if (!r.ok) { alert(d.error || '设定失败'); return; }
        currentTarget = d.target;
        $('target-input').value = d.target.origin;
        refresh();
      } catch (e) { alert('无法连接工作台'); }
    }

    $('recon-btn').addEventListener('click', async () => {
      if (!currentTarget) return;
      $('recon-btn').disabled = true;
      try {
        await fetch('/api/recon', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ origin: currentTarget.origin })
        });
      } catch (e) {}
      refresh();
    });

    $('workflow-btn').addEventListener('click', async () => {
      if (!currentTarget) return;
      $('workflow-btn').disabled = true;
      try {
        const r = await fetch('/api/task', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        const d = await r.json();
        if (!r.ok) alert(d.error || '工作流启动失败');
      } catch (e) { alert('无法连接工作台'); }
      refresh();
    });

    $('research-btn').addEventListener('click', async () => {
      const taskId = workflowTaskId;
      if (!taskId) { alert('请先完成一个五 Agent 任务'); return; }
      const keyword = prompt('输入组件或技术关键词，例如 WordPress Plugin Foo');
      if (!keyword) return;
      $('research-btn').disabled = true;
      try {
        const response = await fetch('/api/research/search', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ task_id: taskId, keyword })
        });
        const result = await response.json();
        if (!response.ok) { alert(result.error || 'Research 查询失败'); return; }
        const refs = result.source_refs || [];
        alert(`${result.result || '查询完成'}${refs.length ? '\n来源证据：' + refs.join(', ') : ''}`);
        if (refs.length && confirm('是否把这次结果保存为待验证的 Research 候选？')) {
          const template = {
            vulnerability_type: 'wordpress_component_cve',
            title: '组件/CVE 候选标题',
            claim: '待验证的安全结论',
            proposed_knowledge: '拟验证并沉淀的技术知识',
            source_refs: refs,
            validation_plan: ['确认目标实际组件及版本', '在授权环境按来源描述复现并保存原始证据']
          };
          const raw = prompt('编辑候选 JSON（source_refs 会绑定到本次查询证据）', JSON.stringify(template, null, 2));
          if (raw) {
            const candidate = JSON.parse(raw);
            candidate.source_refs = refs;
            const created = await fetch('/api/research/candidate', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ task_id: taskId, candidate })
            });
            const data = await created.json();
            if (!created.ok) throw new Error(data.error || '候选保存失败');
            $('research-state').textContent = `候选已保存：${data.candidate.candidate_id}（待受控验证）`;
          }
        }
      } catch (e) { alert('Research 操作失败：' + e.message); }
      finally { refresh(); }
    });

    $('research-manage-btn').addEventListener('click', async () => {
      const taskId = workflowTaskId;
      if (!taskId) return;
      $('research-manage-btn').disabled = true;
      try {
        const snapshotResponse = await fetch('/api/research/' + encodeURIComponent(taskId), { cache: 'no-store' });
        const snapshot = await snapshotResponse.json();
        if (!snapshotResponse.ok) throw new Error(snapshot.error || '读取候选失败');
        const candidates = snapshot.candidates || [];
        if (!candidates.length) { alert('当前任务还没有 Research 候选'); return; }
        const choices = candidates.map(c => `${c.candidate_id} · ${c.status} · ${c.title}`).join('\n');
        const candidateId = prompt('选择候选 ID：\n' + choices, candidates[0].candidate_id);
        if (!candidateId) return;
        const candidate = candidates.find(c => c.candidate_id === candidateId.trim());
        if (!candidate) throw new Error('候选 ID 不在当前任务中');
        const post = async (path, body) => {
          const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ task_id: taskId, ...body }) });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error || 'Research 操作失败');
          return d;
        };
        if (candidate.status === 'proposed') {
          const available = (snapshot.validation_evidence || []).map(e => `${e.evidence_id} (${e.kind})`).join('\n');
          if (!available) { alert('还没有可用的请求、响应、浏览器、CDP 或工具证据。先在授权环境完成验证。'); return; }
          const rawRefs = prompt('输入受控验证用到的证据 ID，逗号分隔：\n' + available);
          if (!rawRefs) return;
          const notes = prompt('记录你观察到的验证结果');
          if (!notes) return;
          const passed = confirm('验证是否成功复现该候选？确定=通过，取消=记录未通过并拒绝候选');
          const result = await post('/api/research/validation', {
            candidate_id: candidateId.trim(), passed,
            evidence_refs: rawRefs.split(',').map(x => x.trim()).filter(Boolean), notes
          });
          $('research-state').textContent = `验证结果：${result.candidate.status}`;
        } else if (candidate.status === 'validated') {
          const vuln = prompt('选择已有 Skill 漏洞目录（例如 xss、sqli、info-disclosure）');
          const variant = vuln && prompt('输入已有 Skill variant 文件名（不含 .md）');
          if (!vuln || !variant) return;
          const result = await post('/api/research/evaluate', {
            candidate_id: candidateId.trim(), vuln, variant
          });
          $('research-state').textContent = `Eval 已排队：Job #${result.job.job_id}`;
        } else if (candidate.status === 'eval_passed') {
          if (!confirm('Eval 已通过。现在明确批准该候选进入 Skill 更新阶段？')) return;
          const result = await post('/api/research/approve', { candidate_id: candidateId.trim() });
          $('research-state').textContent = `已由本地用户批准：${result.candidate.candidate_id}`;
        } else if (candidate.status === 'approved') {
          const vuln = prompt('输入 Eval 时使用的 Skill 漏洞目录');
          const variant = vuln && prompt('输入 Eval 时使用的 Skill variant');
          if (!vuln || !variant || !confirm('提交现有 Skill improver；只有 regression/hidden Eval 通过才会保留更改？')) return;
          const result = await post('/api/research/promote', {
            candidate_id: candidateId.trim(), vuln, variant
          });
          $('research-state').textContent = `Skill 更新任务已提交：Job #${result.job.job_id}`;
        } else {
          alert(`候选当前状态：${candidate.status}`);
        }
      } catch (e) { alert('Research 候选操作失败：' + e.message); }
      finally { refresh(); }
    });

    $('chat-form').addEventListener('submit', async e => {
      e.preventDefault();
      const text = $('chat-input').value.trim();
      if (!text) return;
      $('send-btn').disabled = true;
      $('chat-input').value = '';
      try {
        await fetch('/api/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
      } catch (e) {}
      $('chat-input').focus();
      refresh();
    });

    $('stop-btn').addEventListener('click', async () => {
      $('stop-btn').disabled = true;
      try { await fetch('/api/stop', { method: 'POST' }); } catch (e) {}
      refresh();
    });

    $('drawer-close').addEventListener('click', () => $('drawer').classList.remove('open'));
    $('chat-input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('chat-form').requestSubmit(); }
    });

    refresh();
    setInterval(refresh, 900);
  </script>
</body>
</html>
